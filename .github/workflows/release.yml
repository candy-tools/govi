name: Release
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

# goreleaser needs write access to publish the release and upload assets
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags are required for the changelog
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install cgo build dependencies (libmpv, GLFW/X11 headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv-dev libgl1-mesa-dev xorg-dev

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the .deb for the Debian repo
        # after goreleaser writes and uploads the .deb, hand it to the apt job
        # below. only the .deb: dist/ also holds the binaries and archives, and
        # a flat artifact means "every release" of the Debian repo.
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error

  # register the .deb with candy-tools/debian-repo through the
  # gh-action-debian-repo engine: it writes packages/govi.json there and pushes
  # it, triggering a publish. the default GITHUB_TOKEN is scoped to this repo
  # only, so it authenticates as the candy-tools GitHub App (org variable
  # APT_APP_ID + secret APT_APP_PRIVATE_KEY), which mints a short-lived token
  # scoped to debian-repo.
  apt:
    needs: release
    permissions:
      contents: read
    uses: andresbott/gh-action-debian-repo/.github/workflows/publish.yml@v1.0.0-rc.2
    with:
      name: govi          # must match the .deb's Package field (nfpms package_name)
      artifact: debs
      collection: candy-tools/debian-repo
      app-id: ${{ vars.APT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.APT_APP_PRIVATE_KEY }}

  # govi links libmpv/GLFW through cgo, so darwin binaries must be built on
  # macOS. goreleaser OSS has no --split/--merge, so this is a second,
  # independent release run that appends its artifacts to the release the linux
  # job already created — hence `needs: release`, which also guarantees the
  # changelog exists before this run sees it.
  release-darwin:
    needs: release
    # macos-latest is Apple Silicon (arm64) and free for public repos; the
    # -intel / -large labels are the billed x86_64 ones.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags are required for the version templates
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install cgo build dependencies (libmpv via mpv, pkg-config)
        # pkgconf is installed explicitly rather than assumed present: the
        # pkgconfig build tag makes it a hard requirement.
        run: brew install mpv pkgconf

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser.darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # cross-repo PAT so goreleaser can push the cask to candy-tools/homebrew-tap;
          # the default GITHUB_TOKEN is scoped to this repo only.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Show the resulting libmpv linkage
        # makes the real dylib paths visible in the log of every release: they
        # must be under /opt/homebrew/opt/mpv, not a versioned Cellar path
        # (see docs/agents/releasing.md). Also guards against a vacuous build.
        run: |
          bin=$(find dist -name govi -type f | head -1)
          test -n "$bin" || { echo "no darwin binary was produced"; exit 1; }
          otool -L "$bin"

      - name: Check the published .app bundle and disk image
        # A release must not ship a bundle macOS silently ignores, so the
        # generated Info.plist is validated with plutil (the same parser Launch
        # Services uses) and the image with hdiutil. Same checks as the
        # build-darwin job in test.yml — repeated here because the release is the
        # artifact users actually get.
        run: |
          app=$(find dist -name 'govi.app' -type d | head -1)
          test -n "$app" || { echo "no govi.app was produced"; exit 1; }
          plutil -lint "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/govi.icns" || { echo "the bundle has no icon"; exit 1; }
          test -x "$app/Contents/MacOS/govi" || { echo "the bundled binary is not executable"; exit 1; }

          dmg=$(find dist -name '*.dmg' | head -1)
          test -n "$dmg" || { echo "no .dmg was produced"; exit 1; }
          hdiutil imageinfo "$dmg" > /dev/null || { echo "the .dmg is not a readable image"; exit 1; }
          echo "published bundle and image OK: $app / $dmg"
