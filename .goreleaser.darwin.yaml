version: 2
# =====================================================================================
# darwin-only release config. govi links libmpv and GLFW through cgo, so darwin
# binaries have to be compiled on macOS, and goreleaser's --split/--merge is
# Pro-only. So this is a second, independent `goreleaser release` run (see
# .github/workflows/release.yml) that appends its artifacts to the release the
# linux run already created. .goreleaser.yaml stays linux-only.
# =====================================================================================
before:
  hooks:
    - go mod tidy
builds:
  - id: govi-darwin
    goos:
      - darwin
    goarch:
      # arm64 only: an Intel build needs a separate macos-*-intel runner, billed
      # at 12x the arm64 rate on every tagged release, and every Mac sold since
      # 2020 is arm64.
      - arm64
    env:
      - CGO_ENABLED=1
      # the oldest macOS this binary is allowed to demand, and it is load-bearing
      # rather than a nicety. cgo forces external linking, so clang — not Go —
      # writes the LC_BUILD_VERSION load command, and with no deployment target
      # set clang stamps the *runner's* OS version into it. macos-latest is macOS
      # 26, so v0.1.5 shipped a binary declaring minos 26.0: Launch Services
      # trusts that field over Info.plist and refuses to open the bundle from
      # Finder with "you need to upgrade to 26.0", while a direct exec from a
      # shell still works because dyld is laxer. Keep in step with minSystem in
      # zarf/macos/main.go — the post-build hook compares the two and fails the
      # build when they disagree.
      - MACOSX_DEPLOYMENT_TARGET=12.0
    tags:
      # required, not cosmetic: go-mpv's default cgo path is a bare `-lmpv`,
      # and clang does not search Homebrew's /opt/homebrew/{include,lib}. The
      # pkgconfig tag switches it to `pkg-config: mpv`, and Homebrew's mpv
      # formula ships lib/pkgconfig/mpv.pc (it is built with -Dlibmpv=true).
      - pkgconfig
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/candy-tools/govi/app/metainfo.Version={{.Version}}
      - -X github.com/candy-tools/govi/app/metainfo.BuildTime={{.Date}}
      - -X github.com/candy-tools/govi/app/metainfo.ShaVer={{.Commit}}
    # a path, not a plain name: goreleaser writes the binary to
    # dist/<id>_<target>/<binary>, so this lays out the Contents/MacOS/ level of
    # the .app in place, and the archive below inherits the same relative path
    # (see archive.Pipe, which uses the binary's name as its destination).
    # `binary: govi` would give a bare CLI with no Dock icon and no Finder
    # "Open with" entry.
    binary: govi.app/Contents/MacOS/govi
    hooks:
      # fills in the rest of the bundle — Info.plist and the .icns — around the
      # binary goreleaser just wrote, mirrors those two files to
      # dist/macos-bundle/ for the archive below, and writes the .dmg (macOS
      # only). goreleaser's own app_bundles/dmg sections are Pro-only, which is
      # why this is a hook. See docs/agents/releasing.md.
      #
      # --out is dist, not the per-target directory: the .app is completed in
      # place next to {{ .Path }} (the tool detects that it is already inside
      # one), so --out only decides where the .dmg and the mirrored files land.
      post:
        - go run ./zarf/macos --binary "{{ .Path }}" --version "{{ .Version }}" --out dist --dmg-name "govi_{{ .Version }}_macos_{{ .Arch }}"

archives:
  - formats: [tar.gz]
    # same naming as the linux config, so the OS/Arch match `uname` output.
    name_template: >-
      govi_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md
      # the two bundle files the post-hook mirrored into dist/macos-bundle/. dst
      # mirrors the layout `binary:` already gives the executable, so the archive
      # holds one complete govi.app. The mirror exists because the real build
      # directory carries an unpredictable microarch suffix
      # (dist/govi-darwin_darwin_arm64_v8.0/).
      - src: dist/macos-bundle/Contents/Info.plist
        dst: govi.app/Contents/Info.plist
      - src: dist/macos-bundle/Contents/Resources/govi.icns
        dst: govi.app/Contents/Resources/govi.icns

homebrew_casks:
  # publish a macOS cask into this same repo (Casks/govi.rb). the repo isn't
  # named homebrew-*, so users tap it by explicit URL — see README. the default
  # GITHUB_TOKEN can push here.
  - name: govi
    # `app` cannot be expressed by any homebrew_casks field in the OSS build (it
    # exists only for Pro's dmg pipeline), so it is injected as raw Ruby. This is
    # what installs the bundle into /Applications and gives govi a Dock icon, a
    # Launchpad entry and a Finder "Open with" entry. Homebrew's `app` stanza
    # works from a .tar.gz just as well as from a .dmg.
    custom_block: |
      app "govi.app"
    # the binary lives inside the bundle now, so PATH gets a symlink into it
    # rather than a second copy. single-quoted: #{appdir} is Ruby interpolation
    # evaluated by brew, and must survive goreleaser's YAML/template pass.
    # Homebrew installs `app` before `binary` (ORDINARY_ARTIFACT_CLASSES), so the
    # target exists by the time the symlink is made.
    binaries:
      - '#{appdir}/govi.app/Contents/MacOS/govi'
    repository:
      owner: andresbott
      name: govi
    directory: Casks
    commit_author:
      name: Andres Bott
      email: contact@andresbott.com
    homepage: "https://github.com/candy-tools/govi"
    description: "Minimalistic video player based on mpv"
    url:
      # needed for `brew audit` to pass, since the download and homepage
      # domains differ in form.
      verified: github.com/candy-tools/govi/
    dependencies:
      # mpv is what supplies libmpv.2.dylib at runtime.
      - formula: mpv
    # the darwin binary isn't code-signed/notarized, so strip the Gatekeeper
    # quarantine attribute on install to avoid a "govi is damaged" error. the
    # target is the .app now, not a bare binary; -dr recurses, so the executable
    # inside it is covered. this runs while the payload is still in staged_path,
    # before the `app` stanza moves it to /Applications.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/govi.app"]
          end

release:
  # explicit, though it is the default: this run must never touch the changelog
  # the linux run wrote.
  mode: keep-existing
  extra_files:
    # the .dmg the post-build hook produced. goreleaser knows nothing about it —
    # it is uploaded as an opaque extra file, which is also why it cannot be the
    # cask's download (no checksum is computed for it). It is the install path
    # for people who don't use Homebrew: mount, drag govi.app to Applications.
    - glob: dist/*.dmg

checksum:
  # must differ from the linux run's checksums.txt — two runs upload to one
  # release and identically named assets would collide.
  name_template: 'checksums_darwin.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
changelog:
  # the linux run owns the changelog; generating a second one here would be
  # dead work.
  disable: true
